name: Repair LawBox badge

on:
  push:
    paths:
      - '.github/workflows/repair-lawbox-badge.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download exact original badge
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 \
            'https://github.com/user-attachments/assets/6de19b90-8caa-453d-84a8-d8cd764c111b' \
            -o assets/lawbox-top10.jpg
          echo '50ae03c5c48cf69f127aed99ad368db4797adc18298d89f9d53ffa6b2295aa11  assets/lawbox-top10.jpg' | sha256sum -c -

      - name: Fix README rendering
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('README.md')
          s = p.read_text()
          old = '''  <img\n    src="assets/lawbox-top10.jpg"\n    alt="Top 10 CN Legal Skills — LawBox"\n  />'''
          new = '''  <img\n    src="assets/lawbox-top10.jpg"\n    alt="Top 10 CN Legal Skills — LawBox"\n    width="460"\n  />'''
          if old in s:
              s = s.replace(old, new, 1)
          p.write_text(s)
          PY

      - name: Commit repaired asset
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/repair-lawbox-badge.yml
          git add assets/lawbox-top10.jpg README.md
          git commit -m 'fix: restore exact LawBox Top 10 badge image'
          git push origin HEAD:main
